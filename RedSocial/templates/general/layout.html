{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}Titulo base{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    
</head>
<body>
    {% include '_includes/_header.html' %}

    <div class="container mt-4 main-container">
        <!-- Alertas de Django con estilo -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                {% include '_includes/_messages.html' %}
            </div>
        </div>

        <!-- Contenido dinámico -->
        <main class="py-3">
            {% block page_content %}
            {% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <footer class="py-4 mt-5 bg-dark text-white text-center">
        {% include '_includes/_footer.html' %}
    </footer>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <script>
        const likeButtons = document.querySelectorAll('.likeButton');
        likeButtons.forEach(likeButton => {
            // Quitamos la lógica de nLikes de aquí afuera para que siempre 
            // lea el número actual del span antes de actualizar
            likeButton.addEventListener('click', (event) => {
                event.preventDefault();
                fetch(likeButton.href)
                    .then(response => response.json())
                    .then(data => {
                        // Usamos data.likes_count si tu backend lo envía, 
                        // si no, mantenemos tu lógica de nLikes
                        let currentLikes = data.likes_count !== undefined ? data.likes_count : parseInt(likeButton.querySelector('span').innerHTML);

                        if (data.liked) {
                            // AGREGAMOS text-danger aquí
                            likeButton.innerHTML = `<span>${currentLikes}</span> <i class="bi bi-heart-fill text-danger"></i>`;
                        } else {
                            // Mantenemos bi-heart normal (negro)
                            likeButton.innerHTML = `<span>${currentLikes}</span> <i class="bi bi-heart"></i>`;
                        }
                    })
                    .catch(error => console.error('Error:', error));
            });
        });
    </script>

    </body>
</html>
