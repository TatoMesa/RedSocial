{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}Titulo base{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    
</head>
<body>
    {% include '_includes/_header.html' %}

    <div class="container mt-4 main-container">
        <!-- Alertas de Django con estilo -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                {% include '_includes/_messages.html' %}
            </div>
        </div>

        <!-- Contenido dinámico -->
        <main class="py-3">
            {% block page_content %}
            {% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <footer class="py-4 mt-5 bg-dark text-white text-center">
        {% include '_includes/_footer.html' %}
    </footer>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <script>
        const likeButtons = document.querySelectorAll('.likeButton');
        likeButtons.forEach(likeButton => {
            let nLikesSpan = likeButton.querySelector('span');
            let nLikes = parseInt(nLikesSpan.innerHTML);
            likeButton.addEventListener('click', (event) =>{
                event.preventDefault();
                fetch(likeButton.href)
                    .then(response => response.json())
                    .then(data =>{
                        if (data.liked){
                            nLikes +=1;
                            likeButton.innerHTML = `<span>${nLikes}</span> <i class="bi bi-heart-fill"></i>`;
                            
                        }else{
                            nLikes -=1;
                            likeButton.innerHTML = `<span>${nLikes}</span> <i class="bi bi-heart"></i>`;
                        }
                    });
            });
        });
    </script>

    </body>
</html>
